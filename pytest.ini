[pytest]
# Pytest configuration for g8aural

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = tests

# Output options
addopts =
    -v
    --tb=short
    --strict-markers
    --disable-warnings

# Markers for categorizing tests
markers =
    unit: Unit tests (fast, isolated)
    integration: Integration tests (may be slower)
    music_theory: Tests for music theory modules
    ui: Tests for UI components
    slow: Tests that take significant time to run

# Coverage options (if pytest-cov is installed)
# Uncomment to enable coverage reporting
# addopts = ... --cov=modules --cov=handlers --cov=state --cov=ui --cov=config --cov-report=html --cov-report=term

# Minimum Python version
minversion = 3.10
